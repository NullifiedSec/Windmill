[package]
name = "windmill"
version = "0.5.1"
edition = "2024"
license = "MIT"
description = "Local-first personal media center"

[dependencies]
rusqlite = { version = "0.37", features = ["bundled"] }
ratatui = "0.30"
crossterm = "0.29"
serde_json = "1"
sha2 = "0.10"
zbus = { version = "5.12", features = ["blocking"] }
tempfile = "3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
